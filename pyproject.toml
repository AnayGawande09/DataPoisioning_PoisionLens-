[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poisonlens"
version = "0.1.0"
description = "Detection plus controlled mitigation of training-data poisoning in PyTorch"
authors = [{ name = "ML Security Engineer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "pydantic>=2",
    "psutil>=5.9",
    "pandas>=2.2",
    # pyarrow 26.0.1 DLLs were blocked by Windows Smart App Control on the dev machine (new,
    # low-reputation binaries); 23.0.1 loads. Revisit the upper bound later (docs/MIGRATION_NOTES.md).
    "pyarrow>=17,<24",
    "charset-normalizer>=3",
    "defusedxml>=0.7",
    "openpyxl>=3.1",
    "xlrd>=2",
    "odfpy>=1.4",
    "pillow>=10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pytest",
]

[project.optional-dependencies]
formats = [
    "py7zr>=0.20",
    "fastavro>=1.9",
    # 1.3.8 blocked by Smart App Control on the dev machine; 1.3.7 loads.
    "pyreadstat>=1.2,<1.3.8",
    "h5py>=3.10",
    "soundfile>=0.12",
]
dev = ["ruff", "mypy", "types-PyYAML", "xlwt", "httpx"]  # xlwt only writes the .xls test fixture

[tool.setuptools.packages.find]
where = ["."]
include = ["poisonlens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["poisonlens/bench", "bench_artifacts", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S101: asserts are fine in tests; B008: FastAPI Path()/Query() defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S311", "S603", "S605", "S607", "E501"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
files = ["poisonlens/core", "poisonlens/ingest", "poisonlens/adapters", "poisonlens/security", "poisonlens/audit/ledger.py", "poisonlens/demo", "backend"]
