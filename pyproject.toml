[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poisonlens"
version = "0.1.0"
description = "Detection plus controlled mitigation of training-data poisoning in PyTorch"
authors = [{ name = "ML Security Engineer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poisonlens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
