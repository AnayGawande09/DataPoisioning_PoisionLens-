[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poisonlens"
version = "0.1.0"
description = "Detection plus controlled mitigation of training-data poisoning in PyTorch"
authors = [{ name = "ML Security Engineer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "pydantic>=2",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poisonlens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["poisonlens/bench", "bench_artifacts", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S101: asserts are fine in tests; B008: FastAPI Path()/Query() defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "E501"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
files = ["poisonlens/core", "backend"]
